<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>🎲 El dado de parrillas · F1 Glory</title>
<style>
/* ── copia mínima del CSS de insignias del juego (los escudos llegan como HTML desde el iframe) ── */
.team-dot{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);border:2px solid #fff}
img.team-dot{object-fit:cover;border:none}
.spbadge{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;flex:none;border:none;box-shadow:none}
.spbadge i{display:block;width:82%;height:82%}
.spbadge img{display:block;width:82%;height:82%;object-fit:contain}
.spbadge.conCapas{position:relative;overflow:hidden}
.spbadge .capa{position:absolute;inset:9%;width:82%;height:82%}
.spbadge,.team-dot{width:26px;height:26px}
/* ── el laboratorio ── */
body{background:#101017;color:#e4e1ee;font-family:system-ui,sans-serif;margin:0;padding:14px 12px 60px}
h1{font-size:19px;margin:4px 0 2px}
p.sub{color:#9d9aab;font-size:12.5px;margin:0 0 12px}
.controles{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.controles button{background:#23232e;color:#e4e1ee;border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:8px 13px;font-size:13px;font-weight:700;cursor:pointer}
.controles button.era.on{background:#3b82f6;border-color:#3b82f6}
.controles button.dado{background:#16a34a;border-color:#16a34a;font-size:14px}
.controles button:disabled{opacity:.45}
#estado{font-size:12px;color:#9d9aab;min-height:16px;margin-bottom:8px}
.anyo{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-top:1px solid rgba(255,255,255,.06)}
.anyo .y{width:40px;font-weight:800;font-size:12.5px;color:#c9c6d6;font-variant-numeric:tabular-nums;padding-top:5px}
.anyo .fila{display:flex;flex-wrap:wrap;gap:5px;flex:1}
.eq{text-align:center;width:34px}
.eq .n{font-size:8px;color:#8a8798;display:block;margin-top:1px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.eq.nuevo .n{color:#4ade80;font-weight:700}
.bajas{font-size:10px;color:#f87171;align-self:center;max-width:130px}
iframe{position:absolute;left:-10000px;top:0;width:1000px;height:700px;border:0}
</style></head><body>
<h1>🎲 El dado de parrillas</h1>
<p class="sub">Cada tirada simula 30 temporadas de la era —ventas, quiebras, entradas y libreas— sin jugarlas. Verde = equipo que entra ese año; en rojo, los que desaparecen.</p>
<div class="controles">
  <button class="era on" data-era="1990">1990</button>
  <button class="era" data-era="2000">2000</button>
  <button class="era" data-era="2010">2010</button>
  <button class="era" data-era="2020">2020</button>
  <button class="era" data-era="2026">2026</button>
  <button class="dado" id="dado">🎲 Tirar el dado</button>
</div>
<div id="estado"></div>
<div id="salida"></div>
<div id="cuna"></div>
<script>
let ERA="1990";
document.querySelectorAll(".era").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".era").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); ERA=b.dataset.era;
}));
const AÑOS=30;
document.getElementById("dado").addEventListener("click", tirar);
function tirar(){
  /* abierto a pelo (doble clic, file://) los iframes quedan aislados y el dado no puede hablar
     con el juego: mejor decirlo claro que soltar un error críptico. */
  if(location.protocol==="file:"){
    document.getElementById("estado").textContent="⚠️ Así no puedo: abre el laboratorio desde la beta (f1-glory-beta…/laboratorio-parrillas.html), no como archivo suelto. El dado necesita cargar el juego a su lado.";
    return;
  }
  const dado=document.getElementById("dado"); dado.disabled=true;
  document.getElementById("salida").innerHTML="";
  document.getElementById("estado").textContent="montando la era "+ERA+"…";
  const cuna=document.getElementById("cuna"); cuna.innerHTML="";
  const f=document.createElement("iframe"); cuna.appendChild(f);
  f.addEventListener("load", ()=>setTimeout(()=>simular(f), 1800));
  f.src="index.html";
}
function simular(f){
  const w=f.contentWindow, salida=document.getElementById("salida"), estado=document.getElementById("estado");
  try{
    /* el laboratorio NO puede tocar la partida guardada de quien lo abre: se capa el guardado
       del iframe antes de arrancar nada. También los diálogos. */
    w.eval(`localStorage.setItem=function(){}; localStorage.removeItem=function(){};
            /* sin animaciones ni relojes: el laboratorio solo quiere datos. Un bucle del juego a
               intervalo ~0 congela el tiempo virtual del robot, así que aquí dentro los timers van
               capados: nada de intervalos, nada de rAF, y ningún setTimeout por debajo de 50 ms. */
            window.requestAnimationFrame=function(){ return 0; };
            window.setInterval=function(){ return 0; };
            (function(){ var _st=window.setTimeout;
               window.setTimeout=function(fn,ms){ return _st(fn, Math.max(ms||0,50)); }; })();
            window.alert=function(){}; window.confirm=function(){return true;};
            TP_MODE=false; SELECTED_ERA=${JSON.stringify(ERA)};
            document.getElementById("inName")&&(document.getElementById("inName").value="LAB");
            document.getElementById("inNum")&&(document.getElementById("inNum").value="1");
            startCareer();`);
  }catch(e){ estado.textContent="no pude arrancar la era: "+e.message; document.getElementById("dado").disabled=false; return; }
  const base=w.eval("S.baseYear");
  let y=base, previos=null;
  function paso(){
    try{
      if(y>base) w.eval(`advanceEraTo(${y})`);
      const filaJSON=w.eval(`JSON.stringify(F1_TEAMS.map(t=>({n:t.name})).sort((a,b)=>((S.f1perf||{})[b.n]??70)-((S.f1perf||{})[a.n]??70)))`);
      const fila=JSON.parse(filaJSON);
      const actuales=fila.map(t=>t.n);
      const bajas=previos?previos.filter(n=>!actuales.includes(n)):[];
      let html='<div class="anyo"><div class="y">'+y+'</div><div class="fila">';
      for(const t of fila){
        const nuevo=previos&&!previos.includes(t.n);
        let b=""; try{ b=w.eval(`badge(${JSON.stringify(t.n)},"",${y})`); }catch(e){}
        html+='<div class="eq'+(nuevo?' nuevo':'')+'" title="'+t.n+'">'+b+'<span class="n">'+t.n+'</span></div>';
      }
      html+='</div>'+(bajas.length?'<div class="bajas">☠ '+bajas.join(", ")+'</div>':'')+'</div>';
      salida.insertAdjacentHTML("beforeend", html);
      previos=actuales;
    }catch(e){ salida.insertAdjacentHTML("beforeend",'<div class="anyo"><div class="y">'+y+'</div><div style="color:#f87171;font-size:11px">'+e.message+'</div></div>'); }
    estado.textContent="simulando… "+y;
    y++;
    if(y<=base+AÑOS) setTimeout(paso, 10);
    else{ estado.textContent="listo: "+ERA+" → "+(base+AÑOS)+". Tira otra vez para otra realidad."; document.getElementById("dado").disabled=false; }
  }
  paso();
}
</script></body></html>
